[project]
name = "hirecheck"
version = "0.1.0"
description = "Job Listing Lie Detector - Ghost job and scam detection for Naukri.com"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Bikram Biswas"},
]
dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11,<1.0",
    "django-cors-headers>=4.4,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "sentry-sdk[django]>=2.17,<3.0",
    "openai>=1.50,<2.0",
    "google-generativeai>=0.8,<1.0",
    "gunicorn>=23.0,<24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "pre-commit>=4.0,<5.0",
    "django-debug-toolbar>=4.4,<5.0",
    "factory-boy>=3.3,<4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]
exclude = ["backend/apps/*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
