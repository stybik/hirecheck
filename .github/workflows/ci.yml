name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check backend/
      - run: uv run ruff format --check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hirecheck
          POSTGRES_PASSWORD: hirecheck
          POSTGRES_DB: hirecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      TEST_DATABASE_URL: postgres://hirecheck:hirecheck@localhost:5432/hirecheck_test
      HMAC_SECRET_KEY: test-hmac-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run pytest --cov=backend/apps --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml

  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('extension/manifest.json')); print('manifest.json is valid')"

  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        working-directory: tests/extension
        run: npm install
      - name: Run extension DOM extraction tests
        run: node --test tests/extension/*.test.js
